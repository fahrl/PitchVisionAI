
# PitchVisionAI - Custom ByteTrack Configuration

tracker_type: bytetrack

# Detection association thresholds
track_high_thresh: 0.35
track_low_thresh: 0.05
new_track_thresh: 0.35

# Track management
track_buffer: 60

# Matching
match_thresh: 0.8

# Fuse detection confidence with IoU distance
fuse_score: true
